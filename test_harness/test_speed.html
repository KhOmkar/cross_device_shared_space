  const RCON = [0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0x1b, 0x36];

  function keyExpansion(key) {
    const w = new Uint32Array(60);
    for (let i = 0; i < 8; i++) {
      w[i] = (key[4 * i] << 24) | (key[4 * i + 1] << 16) | (key[4 * i + 2] << 8) | key[4 * i + 3];
    }
    for (let i = 8; i < 60; i++) {
      let temp = w[i - 1];
      if (i % 8 === 0) {
        temp = ((SBOX[(temp >>> 16) & 0xff] << 24) |
                (SBOX[(temp >>> 8) & 0xff] << 16) |
                (SBOX[temp & 0xff] << 8) |
                SBOX[temp >>> 24]) ^ (RCON[(i / 8) - 1] << 24);
      } else if (i % 8 === 4) {
        temp = (SBOX[temp >>> 24] << 24) |
               (SBOX[(temp >>> 16) & 0xff] << 16) |
               (SBOX[(temp >>> 8) & 0xff] << 8) |
               SBOX[temp & 0xff];
      }
      w[i] = (w[i - 8] ^ temp) >>> 0;
    }
    return w;
  }

  function gmul(a, b) {
    let p = 0;
    for (let i = 0; i < 8; i++) {
      if (b & 1) p ^= a;
      const hi = a & 0x80;
      a = (a << 1) & 0xff;
      if (hi) a ^= 0x1b;
      b >>= 1;
    }
    return p;
  }

  function encryptBlock(block, w) {
    const state = new Uint8Array(16);
    state.set(block);

    for (let i = 0; i < 4; i++) {
      const rk = w[i];
      state[i * 4] ^= (rk >>> 24) & 0xff;
      state[i * 4 + 1] ^= (rk >>> 16) & 0xff;
      state[i * 4 + 2] ^= (rk >>> 8) & 0xff;
      state[i * 4 + 3] ^= rk & 0xff;
    }

    for (let round = 1; round <= 14; round++) {
      for (let i = 0; i < 16; i++) state[i] = SBOX[state[i]];

      const t1 = state[1]; state[1] = state[5]; state[5] = state[9]; state[9] = state[13]; state[13] = t1;
      const t2 = state[2]; state[2] = state[10]; state[10] = t2;
      const t6 = state[6]; state[6] = state[14]; state[14] = t6;
      const t3 = state[15]; state[15] = state[11]; state[11] = state[7]; state[7] = state[3]; state[3] = t3;

      if (round < 14) {
        for (let c = 0; c < 4; c++) {
          const i = c * 4;
          const a0 = state[i], a1 = state[i + 1], a2 = state[i + 2], a3 = state[i + 3];
          state[i] = gmul(2, a0) ^ gmul(3, a1) ^ a2 ^ a3;
          state[i + 1] = a0 ^ gmul(2, a1) ^ gmul(3, a2) ^ a3;
          state[i + 2] = a0 ^ a1 ^ gmul(2, a2) ^ gmul(3, a3);
          state[i + 3] = gmul(3, a0) ^ a1 ^ a2 ^ gmul(2, a3);
        }
      }

      for (let i = 0; i < 4; i++) {
        const rk = w[round * 4 + i];
        state[i * 4] ^= (rk >>> 24) & 0xff;
        state[i * 4 + 1] ^= (rk >>> 16) & 0xff;
        state[i * 4 + 2] ^= (rk >>> 8) & 0xff;
        state[i * 4 + 3] ^= rk & 0xff;
      }
    }
    return state;
  }

  // 4-Bit Precomputed GHASH Table Lookups
  const R_TABLE = new Uint32Array([
    0x00000000, 0x1c200000, 0x38400000, 0x24600000,
    0x70800000, 0x6ca00000, 0x48c00000, 0x54e00000,
    0xe1000000, 0xfd200000, 0xd9400000, 0xc5600000,
    0x91800000, 0x8da00000, 0xa9c00000, 0xb5e00000
  ]);

  function initGhashTable(H) {
    const T0 = new Uint32Array(16);
    const T1 = new Uint32Array(16);
    const T2 = new Uint32Array(16);
    const T3 = new Uint32Array(16);

    let h0 = (H[0] << 24) | (H[1] << 16) | (H[2] << 8) | H[3];
    let h1 = (H[4] << 24) | (H[5] << 16) | (H[6] << 8) | H[7];
    let h2 = (H[8] << 24) | (H[9] << 16) | (H[10] << 8) | H[11];
    let h3 = (H[12] << 24) | (H[13] << 16) | (H[14] << 8) | H[15];

    T0[8] = h0 >>> 0;
    T1[8] = h1 >>> 0;
    T2[8] = h2 >>> 0;
    T3[8] = h3 >>> 0;

    for (let j = 4; j >= 1; j >>= 1) {
      const lsb = h3 & 1;
      h3 = (h3 >>> 1) | ((h2 & 1) << 31);
      h2 = (h2 >>> 1) | ((h1 & 1) << 31);
      h1 = (h1 >>> 1) | ((h0 & 1) << 31);
      h0 = (h0 >>> 1) ^ (lsb ? 0xe1000000 : 0);

      T0[j] = h0 >>> 0;
      T1[j] = h1 >>> 0;
      T2[j] = h2 >>> 0;
      T3[j] = h3 >>> 0;
    }

    for (let i = 2; i < 16; i <<= 1) {
      for (let j = 1; j < i; j++) {
        T0[i + j] = (T0[i] ^ T0[j]) >>> 0;
        T1[i + j] = (T1[i] ^ T1[j]) >>> 0;
        T2[i + j] = (T2[i] ^ T2[j]) >>> 0;
        T3[i + j] = (T3[i] ^ T3[j]) >>> 0;
      }
    }

    return { T0, T1, T2, T3 };
  }

  function ghashBlocks(table, S, data, offset, length) {
    const { T0, T1, T2, T3 } = table;
    let s0 = S[0], s1 = S[1], s2 = S[2], s3 = S[3];

    for (let i = 0; i < length; i += 16) {
      for (let j = 0; j < 16; j++) {
        const b = data[offset + i + j] || 0;
        
        // High nibble
        const nhi = b >>> 4;
        const c1 = s3 & 0x0f;
        s3 = ((s3 >>> 4) | ((s2 & 0x0f) << 28)) ^ T3[nhi];
        s2 = ((s2 >>> 4) | ((s1 & 0x0f) << 28)) ^ T2[nhi];
        s1 = ((s1 >>> 4) | ((s0 & 0x0f) << 28)) ^ T1[nhi];
        s0 = ((s0 >>> 4) ^ R_TABLE[c1]) ^ T0[nhi];

        // Low nibble
        const nlo = b & 0x0f;
        const c2 = s3 & 0x0f;
        s3 = ((s3 >>> 4) | ((s2 & 0x0f) << 28)) ^ T3[nlo];
        s2 = ((s2 >>> 4) | ((s1 & 0x0f) << 28)) ^ T2[nlo];
        s1 = ((s1 >>> 4) | ((s0 & 0x0f) << 28)) ^ T1[nlo];
        s0 = ((s0 >>> 4) ^ R_TABLE[c2]) ^ T0[nlo];
      }
    }

    S[0] = s0 >>> 0; S[1] = s1 >>> 0; S[2] = s2 >>> 0; S[3] = s3 >>> 0;
  }

    const w = keyExpansion(key);
    const H = encryptBlock(new Uint8Array(16), w);
    const table = initGhashTable(H);

    const J0 = new Uint8Array(16);
    J0.set(iv, 0);
    J0[15] = 1;

    const numBlocks = Math.ceil(plaintext.length / 16);
    const ciphertext = new Uint8Array(plaintext.length);
    const counter = new Uint8Array(J0);

    for (let i = 0; i < numBlocks; i++) {
      let c = (counter[12] << 24) | (counter[13] << 16) | (counter[14] << 8) | counter[15];
      c = (c + 1) >>> 0;
      counter[12] = (c >>> 24) & 0xff;
      counter[13] = (c >>> 16) & 0xff;
      counter[14] = (c >>> 8) & 0xff;
      counter[15] = c & 0xff;

      const encCounter = encryptBlock(counter, w);
      const blockStart = i * 16;
      const blockEnd = Math.min(plaintext.length, blockStart + 16);
      for (let j = blockStart; j < blockEnd; j++) {
        ciphertext[j] = plaintext[j] ^ encCounter[j - blockStart];
      }
    }

    const S = new Uint32Array(4);
    const padLen = Math.ceil(ciphertext.length / 16) * 16;
    const paddedCt = new Uint8Array(padLen);
    paddedCt.set(ciphertext);

    ghashBlocks(table, S, paddedCt, 0, padLen);

    // Length block
    const lenBlock = new Uint8Array(16);
    const bitLen = BigInt(ciphertext.length) * 8n;
    for (let i = 0; i < 8; i++) {
      lenBlock[15 - i] = Number((bitLen >> BigInt(i * 8)) & 0xffn);
    }
    ghashBlocks(table, S, lenBlock, 0, 16);

    const encJ0 = encryptBlock(J0, w);
    const tag = new Uint8Array(16);
    const sBytes = new Uint8Array(16);
    const sView = new DataView(sBytes.buffer);
    sView.setUint32(0, S[0], false);
    sView.setUint32(4, S[1], false);
    sView.setUint32(8, S[2], false);
    sView.setUint32(12, S[3], false);

    for (let i = 0; i < 16; i++) tag[i] = sBytes[i] ^ encJ0[i];

    const out = new Uint8Array(ciphertext.length + 16);
    out.set(ciphertext, 0);
    out.set(tag, ciphertext.length);
    return out;
  }

  function decrypt(key, iv, cipherAndTag) {
    if (cipherAndTag.length < 16) throw new Error("Ciphertext too short");
    const ctLen = cipherAndTag.length - 16;
    const ciphertext = cipherAndTag.slice(0, ctLen);
    const expectedTag = cipherAndTag.slice(ctLen);

    const w = keyExpansion(key);
    const H = encryptBlock(new Uint8Array(16), w);
    const table = initGhashTable(H);

    const J0 = new Uint8Array(16);
    J0.set(iv, 0);
    J0[15] = 1;

    const S = new Uint32Array(4);
    const padLen = Math.ceil(ciphertext.length / 16) * 16;
    const paddedCt = new Uint8Array(padLen);
    paddedCt.set(ciphertext);

    ghashBlocks(table, S, paddedCt, 0, padLen);

    const lenBlock = new Uint8Array(16);
    const bitLen = BigInt(ciphertext.length) * 8n;
    for (let i = 0; i < 8; i++) {
      lenBlock[15 - i] = Number((bitLen >> BigInt(i * 8)) & 0xffn);
    }
    ghashBlocks(table, S, lenBlock, 0, 16);

    const encJ0 = encryptBlock(J0, w);
    const sBytes = new Uint8Array(16);
    const sView = new DataView(sBytes.buffer);
    sView.setUint32(0, S[0], false);
    sView.setUint32(4, S[1], false);
    sView.setUint32(8, S[2], false);
    sView.setUint32(12, S[3], false);

    let tagMismatch = 0;
    for (let i = 0; i < 16; i++) {
      if ((sBytes[i] ^ encJ0[i]) !== expectedTag[i]) tagMismatch = 1;
    }
    if (tagMismatch) throw new Error("AES-GCM authentication tag mismatch!");

    const numBlocks = Math.ceil(ctLen / 16);
    const plaintext = new Uint8Array(ctLen);
    const counter = new Uint8Array(J0);

    for (let i = 0; i < numBlocks; i++) {
      let c = (counter[12] << 24) | (counter[13] << 16) | (counter[14] << 8) | counter[15];
      c = (c + 1) >>> 0;
      counter[12] = (c >>> 24) & 0xff;
      counter[13] = (c >>> 16) & 0xff;
      counter[14] = (c >>> 8) & 0xff;
      counter[15] = c & 0xff;

      const encCounter = encryptBlock(counter, w);
      const blockStart = i * 16;
      const blockEnd = Math.min(ctLen, blockStart + 16);
      for (let j = blockStart; j < blockEnd; j++) {
        plaintext[j] = ciphertext[j] ^ encCounter[j - blockStart];
      }
    }
    return plaintext;
  }

  return { encrypt, decrypt };
})();

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}
function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

  const match = (tagHex === expectedTag);
  const timeMs = (t1 - t0);
