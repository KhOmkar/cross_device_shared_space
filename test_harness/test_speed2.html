    0x51, 0xa3, 0x40, 0x8f, 0x92, 0x9d, 0x38, 0xf5, 0xbc, 0xb6, 0xda, 0x21, 0x10, 0xff, 0xf3, 0xd2,
    0xcd, 0x0c, 0x13, 0xec, 0x5f, 0x97, 0x44, 0x17, 0xc4, 0xa7, 0x7e, 0x3d, 0x64, 0x5d, 0x19, 0x73,
    0x60, 0x81, 0x4f, 0xdc, 0x22, 0x2a, 0x90, 0x88, 0x46, 0xee, 0xb8, 0x14, 0xde, 0x5e, 0x0b, 0xdb,
    0xe0, 0x32, 0x3a, 0x0a, 0x49, 0x06, 0x24, 0x5c, 0xc2, 0xd3, 0xac, 0x62, 0x91, 0x95, 0xe4, 0x79,
    0xe7, 0xc8, 0x37, 0x6d, 0x8d, 0xd5, 0x4e, 0xa9, 0x6c, 0x56, 0xf4, 0xea, 0x65, 0x7a, 0xae, 0x08,
    0xba, 0x78, 0x25, 0x2e, 0x1c, 0xa6, 0xb4, 0xc6, 0xe8, 0xdd, 0x74, 0x1f, 0x4b, 0xbd, 0x8b, 0x8a,
    0x70, 0x3e, 0xb5, 0x66, 0x48, 0x03, 0xf6, 0x0e, 0x61, 0x35, 0x57, 0xb9, 0x86, 0xc1, 0x1d, 0x9e,
    0xe1, 0xf8, 0x98, 0x11, 0x69, 0xd9, 0x8e, 0x94, 0x9b, 0x1e, 0x87, 0xe9, 0xce, 0x55, 0x28, 0xdf,
    0x8c, 0xa1, 0x89, 0x0d, 0xbf, 0xe6, 0x42, 0x68, 0x41, 0x99, 0x2d, 0x0f, 0xb0, 0x54, 0xbb, 0x16
  ]);

  const RCON = [0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0x1b, 0x36];

  const T0 = new Uint32Array(256);
  const T1 = new Uint32Array(256);
  const T2 = new Uint32Array(256);
  const T3 = new Uint32Array(256);

  function gmul2(x) { return ((x << 1) ^ (((x >> 7) & 1) * 0x11b)) & 0xff; }
  function gmul3(x) { return gmul2(x) ^ x; }

  for (let i = 0; i < 256; i++) {
    const s = SBOX[i];
    const s2 = gmul2(s);
    const s3 = gmul3(s);
    T0[i] = ((s2 << 24) | (s << 16) | (s << 8) | s3) >>> 0;
    T1[i] = ((s3 << 24) | (s2 << 16) | (s << 8) | s) >>> 0;
    T2[i] = ((s << 24) | (s3 << 16) | (s2 << 8) | s) >>> 0;
    T3[i] = ((s << 24) | (s << 16) | (s3 << 8) | s2) >>> 0;
  }

  function keyExpansion(key) {
    const w = new Uint32Array(60);
    for (let i = 0; i < 8; i++) {
      w[i] = ((key[4 * i] << 24) | (key[4 * i + 1] << 16) | (key[4 * i + 2] << 8) | key[4 * i + 3]) >>> 0;
    }
    for (let i = 8; i < 60; i++) {
      let temp = w[i - 1];
      if (i % 8 === 0) {
        temp = (((SBOX[(temp >>> 16) & 0xff] << 24) |
                 (SBOX[(temp >>> 8) & 0xff] << 16) |
                 (SBOX[temp & 0xff] << 8) |
                 SBOX[temp >>> 24]) ^ (RCON[(i / 8) - 1] << 24)) >>> 0;
      } else if (i % 8 === 4) {
        temp = ((SBOX[temp >>> 24] << 24) |
                (SBOX[(temp >>> 16) & 0xff] << 16) |
                (SBOX[(temp >>> 8) & 0xff] << 8) |
                SBOX[temp & 0xff]) >>> 0;
      }
      w[i] = (w[i - 8] ^ temp) >>> 0;
    }
    return w;
  }

  function encryptBlockFast(s0, s1, s2, s3, w, out, outOff) {
    s0 = (s0 ^ w[0]) >>> 0;
    s1 = (s1 ^ w[1]) >>> 0;
    s2 = (s2 ^ w[2]) >>> 0;
    s3 = (s3 ^ w[3]) >>> 0;

    for (let r = 1; r < 14; r++) {
      const rk = r * 4;
      const t0 = (T0[(s0 >>> 24) & 0xff] ^ T1[(s1 >>> 16) & 0xff] ^ T2[(s2 >>> 8) & 0xff] ^ T3[s3 & 0xff] ^ w[rk]) >>> 0;
      const t1 = (T0[(s1 >>> 24) & 0xff] ^ T1[(s2 >>> 16) & 0xff] ^ T2[(s3 >>> 8) & 0xff] ^ T3[s0 & 0xff] ^ w[rk + 1]) >>> 0;
      const t2 = (T0[(s2 >>> 24) & 0xff] ^ T1[(s3 >>> 16) & 0xff] ^ T2[(s0 >>> 8) & 0xff] ^ T3[s1 & 0xff] ^ w[rk + 2]) >>> 0;
      const t3 = (T0[(s3 >>> 24) & 0xff] ^ T1[(s0 >>> 16) & 0xff] ^ T2[(s1 >>> 8) & 0xff] ^ T3[s2 & 0xff] ^ w[rk + 3]) >>> 0;
      s0 = t0; s1 = t1; s2 = t2; s3 = t3;
    }

    const rk = 56;
    out[outOff] = SBOX[(s0 >>> 24) & 0xff] ^ (w[rk] >>> 24);
    out[outOff + 1] = SBOX[(s1 >>> 16) & 0xff] ^ (w[rk] >>> 16);
    out[outOff + 2] = SBOX[(s2 >>> 8) & 0xff] ^ (w[rk] >>> 8);
    out[outOff + 3] = SBOX[s3 & 0xff] ^ w[rk];

    out[outOff + 4] = SBOX[(s1 >>> 24) & 0xff] ^ (w[rk + 1] >>> 24);
    out[outOff + 5] = SBOX[(s2 >>> 16) & 0xff] ^ (w[rk + 1] >>> 16);
    out[outOff + 6] = SBOX[(s3 >>> 8) & 0xff] ^ (w[rk + 1] >>> 8);
    out[outOff + 7] = SBOX[s0 & 0xff] ^ w[rk + 1];

    out[outOff + 8] = SBOX[(s2 >>> 24) & 0xff] ^ (w[rk + 2] >>> 24);
    out[outOff + 9] = SBOX[(s3 >>> 16) & 0xff] ^ (w[rk + 2] >>> 16);
    out[outOff + 10] = SBOX[(s0 >>> 8) & 0xff] ^ (w[rk + 2] >>> 8);
    out[outOff + 11] = SBOX[s1 & 0xff] ^ w[rk + 2];

    out[outOff + 12] = SBOX[(s3 >>> 24) & 0xff] ^ (w[rk + 3] >>> 24);
    out[outOff + 13] = SBOX[(s0 >>> 16) & 0xff] ^ (w[rk + 3] >>> 16);
    out[outOff + 14] = SBOX[(s1 >>> 8) & 0xff] ^ (w[rk + 3] >>> 8);
    out[outOff + 15] = SBOX[s2 & 0xff] ^ w[rk + 3];
  }

  // 16-entry 4-bit Table GHASH
  const R_TABLE = new Uint32Array([
    0x00000000, 0x1c200000, 0x38400000, 0x24600000,
    0x70800000, 0x6ca00000, 0x48c00000, 0x54e00000,
    0xe1000000, 0xfd200000, 0xd9400000, 0xc5600000,
    0x91800000, 0x8da00000, 0xa9c00000, 0xb5e00000
  ]);

  function initGhash(hBytes) {
    const T0 = new Uint32Array(16);
    const T1 = new Uint32Array(16);
    const T2 = new Uint32Array(16);
    const T3 = new Uint32Array(16);

    let h0 = ((hBytes[0] << 24) | (hBytes[1] << 16) | (hBytes[2] << 8) | hBytes[3]) >>> 0;
    let h1 = ((hBytes[4] << 24) | (hBytes[5] << 16) | (hBytes[6] << 8) | hBytes[7]) >>> 0;
    let h2 = ((hBytes[8] << 24) | (hBytes[9] << 16) | (hBytes[10] << 8) | hBytes[11]) >>> 0;
    let h3 = ((hBytes[12] << 24) | (hBytes[13] << 16) | (hBytes[14] << 8) | hBytes[15]) >>> 0;

    T0[8] = h0; T1[8] = h1; T2[8] = h2; T3[8] = h3;

    for (let j = 4; j >= 1; j >>= 1) {
      const lsb = h3 & 1;
      h3 = ((h3 >>> 1) | ((h2 & 1) << 31)) >>> 0;
      h2 = ((h2 >>> 1) | ((h1 & 1) << 31)) >>> 0;
      h1 = ((h1 >>> 1) | ((h0 & 1) << 31)) >>> 0;
      h0 = ((h0 >>> 1) ^ (lsb ? 0xe1000000 : 0)) >>> 0;

      T0[j] = h0; T1[j] = h1; T2[j] = h2; T3[j] = h3;
    }

    for (let i = 2; i < 16; i <<= 1) {
      for (let j = 1; j < i; j++) {
        T0[i + j] = (T0[i] ^ T0[j]) >>> 0;
        T1[i + j] = (T1[i] ^ T1[j]) >>> 0;
        T2[i + j] = (T2[i] ^ T2[j]) >>> 0;
        T3[i + j] = (T3[i] ^ T3[j]) >>> 0;
      }
    }

    return { T0, T1, T2, T3 };
  }

  function ghashMultiplyBlock(table, S, b0, b1, b2, b3) {
    const T0 = table.T0, T1 = table.T1, T2 = table.T2, T3 = table.T3;
    
    // XOR input block into state S
    let z0 = S[0] ^ b0;
    let z1 = S[1] ^ b1;
    let z2 = S[2] ^ b2;
    let z3 = S[3] ^ b3;

    let res0 = 0, res1 = 0, res2 = 0, res3 = 0;

    for (let i = 0; i < 4; i++) {
      let word = i === 0 ? z0 : i === 1 ? z1 : i === 2 ? z2 : z3;
      for (let shift = 24; shift >= 0; shift -= 8) {
        const byte = (word >>> shift) & 0xff;
        
        // High nibble
        const c1 = res3 & 0x0f;
        const nhi = byte >>> 4;
        res3 = (((res3 >>> 4) | ((res2 & 0x0f) << 28)) ^ T3[nhi]) >>> 0;
        res2 = (((res2 >>> 4) | ((res1 & 0x0f) << 28)) ^ T2[nhi]) >>> 0;
        res1 = (((res1 >>> 4) | ((res0 & 0x0f) << 28)) ^ T1[nhi]) >>> 0;
        res0 = (((res0 >>> 4) ^ R_TABLE[c1]) ^ T0[nhi]) >>> 0;

        // Low nibble
        const c2 = res3 & 0x0f;
        const nlo = byte & 0x0f;
        res3 = (((res3 >>> 4) | ((res2 & 0x0f) << 28)) ^ T3[nlo]) >>> 0;
        res2 = (((res2 >>> 4) | ((res1 & 0x0f) << 28)) ^ T2[nlo]) >>> 0;
        res1 = (((res1 >>> 4) | ((res0 & 0x0f) << 28)) ^ T1[nlo]) >>> 0;
        res0 = (((res0 >>> 4) ^ R_TABLE[c2]) ^ T0[nlo]) >>> 0;
      }
    }

    S[0] = res0; S[1] = res1; S[2] = res2; S[3] = res3;
  }

  function ghashProcess(table, S, data, length) {
    const view = new DataView(data.buffer, data.byteOffset, length);
    for (let i = 0; i < length; i += 16) {
      const b0 = view.getUint32(i, false);
      const b1 = view.getUint32(i + 4, false);
      const b2 = view.getUint32(i + 8, false);
      const b3 = view.getUint32(i + 12, false);
      ghashMultiplyBlock(table, S, b0, b1, b2, b3);
    }
  }

  function encrypt(key, iv, plaintext) {
    const w = keyExpansion(key);
    const H = new Uint8Array(16);
    encryptBlockFast(0, 0, 0, 0, w, H, 0);
    const ghashTable = initGhash(H);

    const j0_0 = ((iv[0] << 24) | (iv[1] << 16) | (iv[2] << 8) | iv[3]) >>> 0;
    const j0_1 = ((iv[4] << 24) | (iv[5] << 16) | (iv[6] << 8) | iv[7]) >>> 0;
    const j0_2 = ((iv[8] << 24) | (iv[9] << 16) | (iv[10] << 8) | iv[11]) >>> 0;
    const j0_3 = 1;

    const numBlocks = Math.ceil(plaintext.length / 16);
    const ciphertext = new Uint8Array(plaintext.length);
    const encBlock = new Uint8Array(16);

    let counter3 = 1;
    for (let i = 0; i < numBlocks; i++) {
      counter3 = (counter3 + 1) >>> 0;
      encryptBlockFast(j0_0, j0_1, j0_2, counter3, w, encBlock, 0);

      const blockStart = i * 16;
      const blockEnd = Math.min(plaintext.length, blockStart + 16);
      for (let j = blockStart; j < blockEnd; j++) {
        ciphertext[j] = plaintext[j] ^ encBlock[j - blockStart];
      }
    }

    const S = new Uint32Array(4);
    const padLen = Math.ceil(ciphertext.length / 16) * 16;
    const paddedCt = new Uint8Array(padLen);
    paddedCt.set(ciphertext);

    ghashProcess(ghashTable, S, paddedCt, padLen);

    // Length block
    const lenBlock = new Uint8Array(16);
    const lenView = new DataView(lenBlock.buffer);
    const bitLen = BigInt(ciphertext.length) * 8n;
    lenView.setUint32(8, Number(bitLen >> 32n), false);
    lenView.setUint32(12, Number(bitLen & 0xffffffffn), false);
    ghashProcess(ghashTable, S, lenBlock, 16);

    const encJ0 = new Uint8Array(16);
    encryptBlockFast(j0_0, j0_1, j0_2, j0_3, w, encJ0, 0);

    const tag = new Uint8Array(16);
    const sView = new DataView(new Uint8Array(16).buffer);
    sView.setUint32(0, S[0], false);
    sView.setUint32(4, S[1], false);
    sView.setUint32(8, S[2], false);
    sView.setUint32(12, S[3], false);
    const sBytes = new Uint8Array(sView.buffer);

    for (let i = 0; i < 16; i++) tag[i] = sBytes[i] ^ encJ0[i];

    const out = new Uint8Array(ciphertext.length + 16);
    out.set(ciphertext, 0);
    out.set(tag, ciphertext.length);
    return out;
  }

  function decrypt(key, iv, cipherAndTag) {
    if (cipherAndTag.length < 16) throw new Error("Ciphertext too short");
    const ctLen = cipherAndTag.length - 16;
    const ciphertext = cipherAndTag.slice(0, ctLen);
    const expectedTag = cipherAndTag.slice(ctLen);

    const w = keyExpansion(key);
    const H = new Uint8Array(16);
    encryptBlockFast(0, 0, 0, 0, w, H, 0);
    const ghashTable = initGhash(H);

    const j0_0 = ((iv[0] << 24) | (iv[1] << 16) | (iv[2] << 8) | iv[3]) >>> 0;
    const j0_1 = ((iv[4] << 24) | (iv[5] << 16) | (iv[6] << 8) | iv[7]) >>> 0;
    const j0_2 = ((iv[8] << 24) | (iv[9] << 16) | (iv[10] << 8) | iv[11]) >>> 0;
    const j0_3 = 1;

    const S = new Uint32Array(4);
    const padLen = Math.ceil(ciphertext.length / 16) * 16;
    const paddedCt = new Uint8Array(padLen);
    paddedCt.set(ciphertext);

    ghashProcess(ghashTable, S, paddedCt, padLen);

    const lenBlock = new Uint8Array(16);
    const lenView = new DataView(lenBlock.buffer);
    const bitLen = BigInt(ciphertext.length) * 8n;
    lenView.setUint32(8, Number(bitLen >> 32n), false);
    lenView.setUint32(12, Number(bitLen & 0xffffffffn), false);
    ghashProcess(ghashTable, S, lenBlock, 16);

    const encJ0 = new Uint8Array(16);
    encryptBlockFast(j0_0, j0_1, j0_2, j0_3, w, encJ0, 0);

    const sView = new DataView(new Uint8Array(16).buffer);
    sView.setUint32(0, S[0], false);
    sView.setUint32(4, S[1], false);
    sView.setUint32(8, S[2], false);
    sView.setUint32(12, S[3], false);
    const sBytes = new Uint8Array(sView.buffer);

    let tagMismatch = 0;
    for (let i = 0; i < 16; i++) {
      if ((sBytes[i] ^ encJ0[i]) !== expectedTag[i]) tagMismatch = 1;
    }
    if (tagMismatch) throw new Error("AES-GCM authentication tag mismatch!");

    const numBlocks = Math.ceil(ctLen / 16);
    const plaintext = new Uint8Array(ctLen);
    const encBlock = new Uint8Array(16);

    let counter3 = 1;
    for (let i = 0; i < numBlocks; i++) {
      counter3 = (counter3 + 1) >>> 0;
      encryptBlockFast(j0_0, j0_1, j0_2, counter3, w, encBlock, 0);

      const blockStart = i * 16;
      const blockEnd = Math.min(ctLen, blockStart + 16);
      for (let j = blockStart; j < blockEnd; j++) {
        plaintext[j] = ciphertext[j] ^ encBlock[j - blockStart];
      }
    }
    return plaintext;
  }

  return { encrypt, decrypt };
})();

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes;
}
function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

try {
  const key = hexToBytes("3b5a6a4835bdcda1f1ee40ac19433e4643f40756e7cf0a0e335c45993a741a03");
  const iv = hexToBytes("01944d2deb038c6ed09dd249");
  const len = 1048576;
  const pt = new Uint8Array(len);
  for (let i = 0; i < len; i++) pt[i] = (i * 37 + 13) % 256;
  
  const t0 = performance.now();
  const enc = FastAESGCM.encrypt(key, iv, pt);
  const t1 = performance.now();
  
  const tag = enc.slice(enc.length - 16);
  const tagHex = bytesToHex(tag);
  const expectedTag = "bdc1c7fd78dad0e4ad969a60933816e8";
  
  const match = (tagHex === expectedTag);
  const timeMs = (t1 - t0);
  const speedMbps = ((len / (1024 * 1024)) / (timeMs / 1000)).toFixed(2);
  
  // Also test decryption
  const dec = FastAESGCM.decrypt(key, iv, enc);
  let decMatch = true;
  for (let i = 0; i < len; i++) {
    if (dec[i] !== pt[i]) { decMatch = false; break; }
  }
  
  const res = {
    match: match,
    decMatch: decMatch,
    timeMs: timeMs.toFixed(1),
    speedMBps: speedMbps,
    expectedTag: expectedTag,
    actualTag: tagHex
  };
  document.getElementById("out").innerText = JSON.stringify(res);
} catch (e) {
  document.getElementById("out").innerText = JSON.stringify({ error: e.message });
}
